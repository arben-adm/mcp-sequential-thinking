name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        mcp-version: ["latest", "2.0.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - name: Pin minimum SDK
        if: matrix.mcp-version != 'latest'
        run: pip install "mcp==${{ matrix.mcp-version }}"
      - run: python --version
      - run: pip freeze
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy --strict mcp_sequential_thinking/
      - run: pytest tests/ -v --cov=mcp_sequential_thinking --cov-report=term-missing --cov-fail-under=85
      - run: python -m mcp_sequential_thinking.server --ephemeral --health

  artifacts:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install build twine jsonschema
      - run: python scripts/check_metadata.py
      - run: python scripts/check_artifacts.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 verified 2026-09-05
        with:
          name: tested-dist-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  gates:
    if: always()
    needs: [test, artifacts]
    runs-on: ubuntu-latest
    steps:
      - name: Require all mandatory jobs
        run: |
          test "${{ needs.test.result }}" = success
          test "${{ needs.artifacts.result }}" = success
