[project]
name = "mcp-sequential-thinking"
dynamic = ["version"]
description = "Local MCP work notes with reliable sessions, decisions and task resumption"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "ai", "problem-solving", "sequential-thinking"]
authors = [
   { name = "Arben Ademi", email = "arben.ademi@tuta.io" }
]
dependencies = [
   "mcp>=2,<3",
   "pydantic>=2.12.0",
   "portalocker",
   "anyio>=4.9",
]

[project.scripts]
mcp-sequential-thinking = "mcp_sequential_thinking.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=7.0.0",
    "coverage>=7.10",
    "pytest-asyncio>=0.24.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

vis = [
    "matplotlib>=3.5.0",
    "numpy>=1.20.0",
]

web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]

all = [
    "mcp-sequential-thinking[dev,vis,web]",
]

[project.urls]
Source = "https://github.com/arben-adm/mcp-sequential-thinking"

[tool.hatch.version]
path = "mcp_sequential_thinking/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["mcp_sequential_thinking"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"
timeout = 30

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.coverage.run]
patch = ["subprocess"]
parallel = true
relative_files = true
